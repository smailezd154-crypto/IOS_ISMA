name: Build OTA manifest

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-manifest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download IPA from Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir -p ipa

          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "*.ipa" \
            --dir ipa

          IPA=$(find ipa -type f -name "*.ipa" | head -n 1)

          if [ -z "$IPA" ]; then
            echo "ERROR: IPA file not found in Release"
            exit 1
          fi

          echo "IPA: $IPA"
          echo "IPA_PATH=$IPA" >> "$GITHUB_ENV"

      - name: Extract app information
        run: |
          rm -rf extracted
          mkdir extracted

          unzip -q "$IPA_PATH" -d extracted

          PLIST=$(find extracted/Payload -type f -name "Info.plist" | head -n 1)

          if [ -z "$PLIST" ]; then
            echo "ERROR: Info.plist not found"
            exit 1
          fi

          echo "Info.plist: $PLIST"

          python3 - "$PLIST" <<'PY'
          import plistlib
          import sys

          with open(sys.argv[1], "rb") as f:
              p = plistlib.load(f)

          bundle_id = p.get("CFBundleIdentifier")
          version = p.get("CFBundleShortVersionString") or p.get("CFBundleVersion")
          name = p.get("CFBundleDisplayName") or p.get("CFBundleName") or "iOS App"

          if not bundle_id:
              raise SystemExit("ERROR: Bundle ID not found")

          if not version:
              raise SystemExit("ERROR: App version not found")

          with open("bundle_id.txt", "w") as f:
              f.write(bundle_id)

          with open("version.txt", "w") as f:
              f.write(version)

          with open("app_name.txt", "w") as f:
              f.write(name)

          print("Bundle ID:", bundle_id)
          print("Version:", version)
          print("Name:", name)
          PY

      - name: Create manifest.plist
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          IPA_NAME=$(basename "$IPA_PATH")
          BUNDLE_ID=$(cat bundle_id.txt)
          VERSION=$(cat version.txt)
          APP_NAME=$(cat app_name.txt)

          IPA_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${IPA_NAME}"

          python3 - "$IPA_URL" "$BUNDLE_ID" "$VERSION" "$APP_NAME" <<'PY'
          import plistlib
          import sys

          ipa_url = sys.argv[1]
          bundle_id = sys.argv[2]
          version = sys.argv[3]
          app_name = sys.argv[4]

          manifest = {
              "items": [
                  {
                      "assets": [
                          {
                              "kind": "software-package",
                              "url": ipa_url
                          }
                      ],
                      "metadata": {
                          "bundle-identifier": bundle_id,
                          "bundle-version": version,
                          "kind": "software",
                          "title": app_name
                      }
                  }
              ]
          }

          with open("manifest.plist", "wb") as f:
              plistlib.dump(
                  manifest,
                  f,
                  fmt=plistlib.FMT_XML,
                  sort_keys=False
              )

          print("manifest.plist created successfully")
          PY

      - name: Commit manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add manifest.plist

          if git diff --cached --quiet; then
            echo "manifest.plist is already up to date"
            exit 0
          fi

          git commit -m "Generate OTA manifest"
          git push
