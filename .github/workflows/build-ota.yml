name: Build OTA manifest

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-manifest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download IPA
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir -p ipa

          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "*.ipa" \
            --dir ipa

          IPA=$(find ipa -type f -name "*.ipa" -print -quit)

          if [ -z "$IPA" ]; then
            echo "ERROR: IPA not found in Release"
            exit 1
          fi

          echo "IPA: $IPA"
          echo "IPA_PATH=$IPA" >> "$GITHUB_ENV"

      - name: Extract application
        run: |
          rm -rf extracted
          mkdir extracted

          unzip -q "$IPA_PATH" -d extracted

          APP_PLIST=$(find extracted/Payload -maxdepth 2 -type f -path "*/Info.plist" -print -quit)

          if [ -z "$APP_PLIST" ]; then
            echo "ERROR: Application Info.plist not found"
            exit 1
          fi

          echo "Application Info.plist: $APP_PLIST"

          python3 - "$APP_PLIST" <<'PY'
          import plistlib
          import sys

          path = sys.argv[1]

          with open(path, "rb") as f:
              plist = plistlib.load(f)

          bundle_id = plist.get("CFBundleIdentifier", "")
          app_name = (
              plist.get("CFBundleDisplayName")
              or plist.get("CFBundleName")
              or "iOS App"
          )
          version = (
              plist.get("CFBundleShortVersionString")
              or plist.get("CFBundleVersion")
              or ""
          )

          print("Bundle ID:", bundle_id)
          print("App name:", app_name)
          print("Version:", version)

          if not bundle_id:
              raise SystemExit("ERROR: CFBundleIdentifier not found")

          with open("bundle_id.txt", "w") as f:
              f.write(str(bundle_id))

          with open("app_name.txt", "w") as f:
              f.write(str(app_name))

          with open("version.txt", "w") as f:
              f.write(str(version))
          PY

      - name: Create manifest
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          IPA_NAME=$(basename "$IPA_PATH")
          BUNDLE_ID=$(cat bundle_id.txt)
          APP_NAME=$(cat app_name.txt)
          VERSION=$(cat version.txt)

          if [ -z "$VERSION" ]; then
            VERSION="${TAG#v}"
          fi

          IPA_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${IPA_NAME}"

          python3 - "$IPA_URL" "$BUNDLE_ID" "$VERSION" "$APP_NAME" <<'PY'
          import plistlib
          import sys

          ipa_url = sys.argv[1]
          bundle_id = sys.argv[2]
          version = sys.argv[3]
          app_name = sys.argv[4]

          manifest = {
              "items": [
                  {
                      "assets": [
                          {
                              "kind": "software-package",
                              "url": ipa_url
                          }
                      ],
                      "metadata": {
                          "bundle-identifier": bundle_id,
                          "bundle-version": version,
                          "kind": "software",
                          "title": app_name
                      }
                  }
              ]
          }

          with open("manifest.plist", "wb") as f:
              plistlib.dump(
                  manifest,
                  f,
                  fmt=plistlib.FMT_XML,
                  sort_keys=False
              )

          print("manifest.plist created successfully")
          PY

      - name: Commit manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add manifest.plist

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Generate OTA manifest"
            git push
          fi
