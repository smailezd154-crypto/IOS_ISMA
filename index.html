<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iOS App</title>

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f2f2f7;
      color: #111;
      text-align: center;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
      padding: 80px 20px;
    }

    .icon {
      width: 100px;
      height: 100px;
      margin: 0 auto 25px;
      border-radius: 22px;
      background: #007aff;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 42px;
      font-weight: bold;
    }

    h1 {
      font-size: 30px;
      margin-bottom: 10px;
    }

    p {
      color: #666;
      font-size: 17px;
      margin-bottom: 35px;
    }

    .button {
      display: inline-block;
      background: #007aff;
      color: white;
      text-decoration: none;
      padding: 16px 35px;
      border-radius: 14px;
      font-size: 18px;
      font-weight: 600;
    }

    .button:active {
      opacity: 0.7;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="icon">iOS</div>

    <h1>Установка приложения</h1>

    <p>Нажмите кнопку ниже для установки приложения на iPhone.</p>

    <a class="button"
       href="itms-services://?action=download-manifest&url=https://smailezd154-crypto.github.io/IOS_ISMA/manifest.plist">
       Установить приложение
    </a>

  </div>

</body>
</html>
